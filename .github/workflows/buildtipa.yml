name: Build TIPA (Theos)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos + SDKs
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git Theos
          # Theos no longer ships sdks as a submodule — clone separately (required!)
          git clone --depth 1 https://github.com/theos/sdks.git Theos/sdks
          echo "--- Theos/sdks ---"
          ls -1 Theos/sdks/
          test -d Theos/sdks/iPhoneOS16.5.sdk || { echo "::error::iPhoneOS16.5.sdk missing in Theos/sdks (check TARGET in makefile)"; exit 1; }
          echo "SDK OK"
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build .tipa
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/Theos"
          make clean package -j$(sysctl -n hw.ncpu)
          ls -lh packages/
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollSpeed-tipa
          path: packages/*.tipa
          if-no-files-found: error
